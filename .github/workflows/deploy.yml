name: Deploy approved Next.js release to Vercel

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_RCP_SERVICES after the exact commit and rollback have been approved
        required: true
        type: string
      rollback_deployment_id:
        description: Previously verified production deployment ID to restore if the browser smoke test fails
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rcp-services-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_RCP_SERVICES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: rcp-services-production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          NEXT_PUBLIC_SITE_URL: https://rcp.services
          RCP_DEPLOYMENT_ENV: production
      - name: Deploy a staged production build
        id: candidate
        run: |
          url=$(pnpm dlx vercel@latest deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Check the staged deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
        run: |
          pnpm dlx vercel@latest curl /api/health --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" -- --silent --show-error > health.json
          node -e 'const h=require("./health.json"); if (!h.ok || h.deliveryMode !== "crm") process.exit(1)'
      - name: Install browser for production smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Promote the verified build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
        run: pnpm dlx vercel@latest promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
      - name: Verify production interactions on desktop and mobile
        id: smoke
        continue-on-error: true
        run: node scripts/deployment-smoke.mjs https://rcp.services
      - name: Restore the verified production deployment if smoke fails
        if: steps.smoke.outcome == 'failure'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ROLLBACK_DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
        run: pnpm dlx vercel@latest rollback "$ROLLBACK_DEPLOYMENT_ID" --yes --token="$VERCEL_TOKEN"
      - name: Fail the release if smoke failed
        if: ${{ always() && steps.smoke.outcome == 'failure' }}
        run: exit 1
