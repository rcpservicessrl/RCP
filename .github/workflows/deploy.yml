name: Deploy approved Next.js release to Vercel

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_RCP_SERVICES after the exact commit and rollback have been approved
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rcp-services-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_RCP_SERVICES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: rcp-services-production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          NEXT_PUBLIC_SITE_URL: https://rcp.services
          RCP_DEPLOYMENT_ENV: production
      - name: Pull Vercel production settings
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build the approved production artifact
        run: pnpm dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SITE_URL: https://rcp.services
          RCP_DEPLOYMENT_ENV: production
      - name: Deploy the prebuilt artifact
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
