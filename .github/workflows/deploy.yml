name: Deploy approved Next.js release to Vercel

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_RCP_SERVICES after the exact commit and rollback have been approved
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rcp-services-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_RCP_SERVICES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: rcp-services-production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          NEXT_PUBLIC_SITE_URL: https://rcp.services
          RCP_DEPLOYMENT_ENV: production
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser runtime and provider failure isolation
        run: |
          pnpm start --hostname 127.0.0.1 --port 3117 > /tmp/rcp-runtime.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3117/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/runtime-smoke.mjs
      - name: Install reviewed Vercel CLI
        run: pnpm add --global vercel@58.4.4
      - name: Build production remotely with its actual configuration
        id: candidate
        run: |
          vercel deploy --prod --skip-domain --yes --archive=tgz --scope "$VERCEL_ORG_ID" > /tmp/rcp-candidate-output.txt
          candidate_url=$(node --input-type=module -e 'import fs from "node:fs"; const raw=fs.readFileSync("/tmp/rcp-candidate-output.txt","utf8").trim(); let url; try {url=JSON.parse(raw).deployment.url} catch {url=raw.split("\n").find(line=>/^https:\/\//.test(line.trim()))?.trim()} const u=new URL(url); if(u.protocol!=="https:" || !u.hostname.endsWith(".vercel.app")) process.exit(1); console.log(u.origin)')
          CANDIDATE_URL="$candidate_url" node --input-type=module -e 'const u=new URL(process.env.CANDIDATE_URL); if(u.protocol!=="https:" || !u.hostname.endsWith(".vercel.app")) process.exit(1)'
          printf 'url=%s\n' "$candidate_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Check candidate health before promotion
        run: |
          vercel curl /api/health --deployment "$CANDIDATE_URL" --scope "$VERCEL_ORG_ID" > /tmp/rcp-health.json
          node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("/tmp/rcp-health.json")).ok!==true) process.exit(1)'
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Promote the checked production artifact
        run: vercel promote "$CANDIDATE_URL" --yes --scope "$VERCEL_ORG_ID"
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
